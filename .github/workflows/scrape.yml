name: Daily Classical Concert Scraper & Aggregator

on:
  schedule:
    # Runs at 20:00 UTC every day (04:00 AM Taipei UTC+8)
    - cron: '0 20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run concert aggregators
        run: |
          python scripts/aggregate_all.py

      - name: Commit and push updated concert data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/concerts.json
          if git diff --staged --quiet; then
            echo "No changes to concert data. Skipping commit."
          else
            git commit -m "chore(data): auto-update concert data [skip ci]"
            git push
          fi
